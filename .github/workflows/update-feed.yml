name: Generate ICS Feed

# This grants the bot the necessary permissions to commit and push files
permissions:
  contents: write

on:
  schedule:
    # Runs at 8:47 AM
    - cron: '17 3 * * *'
  workflow_dispatch: # Allows you to manually trigger the script from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        # Playwright >= 1.48.0 in requirements.txt ensures this works on ubuntu-latest
        run: playwright install --with-deps chromium

      - name: Run Scraper
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add delhi_screenings.ics
          
          # Check if the ICS file actually changed. If yes, commit and push.
          if ! git diff --staged --quiet; then
            git commit -m "Automated update: refresh delhi_screenings.ics"
            git push
          else
            echo "No new screenings found. Skipping commit."
          fi